<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background subtle circle -->
  <circle cx="200" cy="160" r="110" fill="#EDE6D6" opacity="0.4"/>

  <!-- Jacket body -->
  <path d="M140 90 C140 80, 155 70, 200 70 C245 70, 260 80, 260 90 L270 220 C270 240, 250 250, 200 250 C150 250, 130 240, 130 220 Z" fill="#8B7355"/>

  <!-- Left body shading -->
  <path d="M140 90 L130 220 C130 240, 150 250, 200 250 L200 70 C155 70, 140 80, 140 90 Z" fill="#7A5C3A"/>

  <!-- Center zipper -->
  <line x1="200" y1="75" x2="200" y2="245" stroke="#6B5B3F" stroke-width="2"/>
  <line x1="200" y1="85" x2="200" y2="200" stroke="#EDE6D6" stroke-width="1" stroke-dasharray="2,3" opacity="0.5"/>

  <!-- Zipper pull -->
  <rect x="195" y="195" width="10" height="5" rx="1" fill="#C4622D"/>

  <!-- Left collar / lapel -->
  <path d="M145 90 L165 75 L175 95 L160 120 L145 110 Z" fill="#A67B5B"/>
  <path d="M145 90 L165 75 L175 95" fill="#9B6B4B"/>

  <!-- Right collar / lapel -->
  <path d="M255 90 L235 75 L225 95 L240 120 L255 110 Z" fill="#A67B5B"/>

  <!-- Left sleeve -->
  <path d="M140 90 L95 130 L85 200 L90 210 L120 195 L130 150 L145 120" fill="#7A5C3A"/>
  <path d="M140 90 L95 130 L85 200" fill="#6B5B3F"/>

  <!-- Right sleeve -->
  <path d="M260 90 L305 130 L315 200 L310 210 L280 195 L270 150 L255 120" fill="#8B7355"/>

  <!-- Pocket left -->
  <path d="M160 160 L195 160 L195 195 L160 195 Z" fill="#A67B5B" stroke="#7A5C3A" stroke-width="1"/>
  <line x1="177" y1="160" x2="177" y2="195" stroke="#7A5C3A" stroke-width="1"/>

  <!-- Pocket right -->
  <path d="M205 160 L240 160 L240 195 L205 195 Z" fill="#A67B5B" stroke="#7A5C3A" stroke-width="1"/>
  <line x1="222" y1="160" x2="222" y2="195" stroke="#7A5C3A" stroke-width="1"/>

  <!-- Shoulder seams -->
  <path d="M145 90 L155 85" stroke="#6B5B3F" stroke-width="1.5"/>
  <path d="M255 90 L245 85" stroke="#6B5B3F" stroke-width="1.5"/>

  <!-- Hood (folded down behind) -->
  <path d="M150 75 C140 55, 160 40, 200 40 C240 40, 260 55, 250 75" fill="#A67B5B" stroke="#7A5C3A" stroke-width="1.5"/>

  <!-- Hood fold line -->
  <path d="M160 55 C175 65, 225 65, 240 55" stroke="#8B7355" stroke-width="1" fill="none" opacity="0.6"/>

  <!-- Orange accent - pull tab -->
  <rect x="194" y="202" width="12" height="4" rx="1" fill="#C4622D"/>

  <!-- Elastic cuff indication left -->
  <line x1="87" y1="198" x2="118" y2="196" stroke="#6B5B3F" stroke-width="3" stroke-linecap="round"/>

  <!-- Elastic cuff indication right -->
  <line x1="282" y1="198" x2="313" y2="196" stroke="#6B5B3F" stroke-width="3" stroke-linecap="round"/>

  <!-- Hem -->
  <path d="M135 245 C150 255, 250 255, 265 245" stroke="#6B5B3F" stroke-width="2.5" fill="none"/>
</svg>
