<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background subtle circle -->
  <circle cx="200" cy="155" r="110" fill="#EDE6D6" opacity="0.4"/>

  <!-- Stove body - canister type -->
  <path d="M155 180 L155 140 C155 120, 175 110, 200 110 C225 110, 245 120, 245 140 L245 180 Z" fill="#8B7355"/>

  <!-- Stove body shading left -->
  <path d="M155 180 L155 140 C155 120, 175 110, 200 110 L200 180 Z" fill="#7A5C3A"/>

  <!-- Burner head -->
  <ellipse cx="200" cy="108" rx="30" ry="8" fill="#A67B5B"/>
  <ellipse cx="200" cy="108" rx="25" ry="6" fill="#6B5B3F"/>

  <!-- Burner jets (small circles) -->
  <circle cx="185" cy="108" r="2" fill="#1A1714" opacity="0.6"/>
  <circle cx="195" cy="108" r="2" fill="#1A1714" opacity="0.6"/>
  <circle cx="205" cy="108" r="2" fill="#1A1714" opacity="0.6"/>
  <circle cx="215" cy="108" r="2" fill="#1A1714" opacity="0.6"/>

  <!-- Flame -->
  <path d="M192 80 C192 68, 198 55, 200 50 C202 55, 208 68, 208 80 C208 88, 204 92, 200 92 C196 92, 192 88, 192 80 Z" fill="#C4622D" opacity="0.9"/>
  <path d="M195 78 C195 70, 199 60, 200 58 C201 60, 205 70, 205 78 C205 84, 203 87, 200 87 C197 87, 195 84, 195 78 Z" fill="#EDE6D6" opacity="0.7"/>
  <path d="M197 76 C197 72, 199 65, 200 63 C201 65, 203 72, 203 76 C203 79, 201 81, 200 81 C199 81, 197 79, 197 76 Z" fill="#F5EDDC" opacity="0.5"/>

  <!-- Canister body lines -->
  <line x1="165" y1="150" x2="235" y2="150" stroke="#6B5B3F" stroke-width="1" opacity="0.5"/>
  <line x1="163" y1="160" x2="237" y2="160" stroke="#6B5B3F" stroke-width="1" opacity="0.5"/>
  <line x1="160" y1="170" x2="240" y2="170" stroke="#6B5B3F" stroke-width="1" opacity="0.5"/>

  <!-- Support arms / pot supports -->
  <path d="M160 130 L140 118" stroke="#7A5C3A" stroke-width="3" stroke-linecap="round"/>
  <path d="M240 130 L260 118" stroke="#7A5C3A" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 110 L200 95" stroke="#7A5C3A" stroke-width="3" stroke-linecap="round"/>

  <!-- Pot support tips -->
  <circle cx="140" cy="118" r="2.5" fill="#C4622D"/>
  <circle cx="260" cy="118" r="2.5" fill="#C4622D"/>
  <circle cx="200" cy="95" r="2.5" fill="#C4622D"/>

  <!-- Valve knob -->
  <ellipse cx="200" cy="180" rx="6" ry="4" fill="#C4622D"/>
  <circle cx="200" cy="180" r="2" fill="#1A1714" opacity="0.5"/>

  <!-- Ground -->
  <path d="M100 230 L300 230" stroke="#8B7355" stroke-width="1.5" opacity="0.3"/>
  <ellipse cx="200" cy="230" rx="50" ry="4" fill="#1A1714" opacity="0.06"/>
</svg>
