<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background subtle circle -->
  <circle cx="200" cy="155" r="110" fill="#EDE6D6" opacity="0.4"/>

  <!-- Shadow underneath -->
  <ellipse cx="200" cy="245" rx="120" ry="8" fill="#1A1714" opacity="0.06"/>

  <!-- Sleeping mat - rolled up view, slightly angled -->
  <!-- Main roll shape -->
  <path d="M130 180 C130 140, 160 120, 200 120 C240 120, 270 140, 270 180 C270 220, 240 240, 200 240 C160 240, 130 220, 130 180 Z" fill="#6B8354"/>

  <!-- Mat spiral layers (side view of roll) -->
  <path d="M130 180 C130 145, 158 128, 200 128 C242 128, 270 145, 270 180 C270 215, 242 232, 200 232 C158 232, 130 215, 130 180 Z" fill="#5A7A48"/>

  <!-- Inner spiral -->
  <path d="M200 135 C228 135, 250 150, 250 180 C250 210, 228 225, 200 225 C172 225, 150 210, 150 180 C150 150, 172 135, 200 135 Z" fill="#4A6B3A"/>

  <!-- Center spiral -->
  <path d="M200 148 C215 148, 228 157, 228 180 C228 203, 215 212, 200 212 C185 212, 172 203, 172 180 C172 157, 185 148, 200 148 Z" fill="#6B8354"/>

  <!-- Center core -->
  <ellipse cx="200" cy="180" rx="18" ry="22" fill="#3A5A2A"/>

  <!-- Spiral line details -->
  <path d="M155 180 C155 160, 172 148, 200 148" stroke="#7A9A5E" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M245 180 C245 160, 228 148, 200 148" stroke="#7A9A5E" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M155 180 C155 200, 172 212, 200 212" stroke="#7A9A5E" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M245 180 C245 200, 228 212, 200 212" stroke="#7A9A5E" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Side face of the mat (the flat side) -->
  <path d="M130 180 L110 185 C105 185, 100 180, 110 175 L130 170 Z" fill="#8B7355"/>
  <path d="M270 180 L290 185 C295 185, 300 180, 290 175 L270 170 Z" fill="#8B7355"/>

  <!-- Roll strap -->
  <path d="M160 130 C175 118, 200 115, 220 120" stroke="#C4622D" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M160 235 C175 245, 200 248, 220 243" stroke="#C4622D" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Strap buckle -->
  <rect x="188" y="118" width="8" height="6" rx="1" fill="#EDE6D6" stroke="#C4622D" stroke-width="1"/>
  <rect x="192" y="240" width="8" height="6" rx="1" fill="#EDE6D6" stroke="#C4622D" stroke-width="1"/>

  <!-- Texture dots on the mat (foam pattern) -->
  <circle cx="182" cy="160" r="1.5" fill="#EDE6D6" opacity="0.2"/>
  <circle cx="210" cy="155" r="1.5" fill="#EDE6D6" opacity="0.2"/>
  <circle cx="195" cy="170" r="1.5" fill="#EDE6D6" opacity="0.2"/>
  <circle cx="220" cy="175" r="1.5" fill="#EDE6D6" opacity="0.2"/>
  <circle cx="185" cy="195" r="1.5" fill="#EDE6D6" opacity="0.2"/>
  <circle cx="215" cy="200" r="1.5" fill="#EDE6D6" opacity="0.2"/>
  <circle cx="175" cy="215" r="1.5" fill="#EDE6D6" opacity="0.2"/>
  <circle cx="230" cy="190" r="1.5" fill="#EDE6D6" opacity="0.2"/>

  <!-- Unrolled mat strip suggestion at top -->
  <path d="M130 128 C130 125, 135 120, 150 120 L250 120 C265 120, 270 125, 270 128" stroke="#5A7A48" stroke-width="2" fill="none"/>
</svg>
