<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background subtle circle -->
  <circle cx="200" cy="155" r="110" fill="#EDE6D6" opacity="0.4"/>

  <!-- Sleeping bag body - slightly diagonal -->
  <path d="M100 250 L105 110 C105 90, 130 75, 200 75 C270 75, 295 90, 295 110 L300 230 C300 245, 280 255, 200 255 C140 255, 100 245, 100 250 Z" fill="#6B8354"/>

  <!-- Lighter inner section -->
  <path d="M115 240 L118 115 C118 100, 138 90, 200 90 C262 90, 282 100, 282 115 L285 230 C285 240, 265 245, 200 245 C148 245, 115 240, 115 240 Z" fill="#5A7A48"/>

  <!-- Darker bottom half (footbox) -->
  <path d="M100 250 L105 180 L295 180 L300 230 C300 245, 280 255, 200 255 C140 255, 100 245, 100 250 Z" fill="#4A6B3A"/>

  <!-- Zipper line -->
  <path d="M105 120 C110 130, 115 150, 110 170 C105 190, 108 210, 110 230" stroke="#EDE6D6" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>

  <!-- Zipper pull -->
  <circle cx="108" cy="175" r="3" fill="#C4622D"/>

  <!-- Hood/mummy top detail -->
  <path d="M115 110 C120 85, 150 70, 200 70 C250 70, 280 85, 285 110" stroke="#4A6B3A" stroke-width="2.5" fill="none"/>

  <!-- Hood drawstring -->
  <path d="M130 95 C150 80, 175 75, 200 75 C225 75, 250 80, 270 95" stroke="#8B7355" stroke-width="1.5" fill="none"/>

  <!-- Baffle lines (horizontal) -->
  <line x1="120" y1="130" x2="280" y2="130" stroke="#3A5A2A" stroke-width="1" opacity="0.4"/>
  <line x1="118" y1="145" x2="282" y2="145" stroke="#3A5A2A" stroke-width="1" opacity="0.4"/>
  <line x1="115" y1="160" x2="285" y2="160" stroke="#3A5A2A" stroke-width="1" opacity="0.4"/>
  <line x1="112" y1="200" x2="288" y2="200" stroke="#3A5A2A" stroke-width="1" opacity="0.4"/>
  <line x1="110" y1="215" x2="290" y2="215" stroke="#3A5A2A" stroke-width="1" opacity="0.4"/>
  <line x1="108" y1="230" x2="292" y2="230" stroke="#3A5A2A" stroke-width="1" opacity="0.4"/>

  <!-- Compression lines at bottom -->
  <path d="M140 250 C160 253, 200 255, 240 252" stroke="#3A5A2A" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Orange accent tag -->
  <rect x="270" y="100" width="12" height="6" rx="1" fill="#C4622D" transform="rotate(10 276 103)"/>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="258" rx="100" ry="6" fill="#1A1714" opacity="0.08"/>
</svg>
