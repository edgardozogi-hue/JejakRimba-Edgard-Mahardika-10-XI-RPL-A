<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background subtle mountain -->
  <path d="M0 220 L80 130 L140 170 L200 100 L260 160 L320 110 L400 190 L400 300 L0 300 Z" fill="#EDE6D6"/>
  <path d="M0 240 L60 180 L120 210 L200 150 L280 200 L340 160 L400 230 L400 300 L0 300 Z" fill="#E8D5B7" opacity="0.6"/>

  <!-- Ground -->
  <path d="M0 260 L400 260 L400 300 L0 300 Z" fill="#6B8354" opacity="0.3"/>

  <!-- Tent body -->
  <path d="M200 60 L80 260 L320 260 L200 60 Z" fill="#6B8354"/>
  <path d="M200 60 L80 260 L200 260 L200 60 Z" fill="#5A7A48"/>

  <!-- Tent opening -->
  <path d="M200 260 L140 190 L200 140 L260 190 L200 260 Z" fill="#1A1714" opacity="0.85"/>
  <path d="M200 260 L155 196 L200 154 L245 196 L200 260 Z" fill="#EDE6D6"/>

  <!-- Warm glow inside tent -->
  <ellipse cx="200" cy="240" rx="30" ry="10" fill="#C4622D" opacity="0.25"/>

  <!-- Tent pole lines -->
  <line x1="200" y1="60" x2="80" y2="260" stroke="#4A6B3A" stroke-width="2.5"/>
  <line x1="200" y1="60" x2="320" y2="260" stroke="#4A6B3A" stroke-width="2.5"/>

  <!-- Tent ridge detail -->
  <line x1="200" y1="60" x2="200" y2="140" stroke="#4A6B3A" stroke-width="2"/>

  <!-- Ground stakes -->
  <line x1="80" y1="260" x2="70" y2="270" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="320" y1="260" x2="330" y2="270" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Trees on sides -->
  <path d="M50 260 L65 210 L80 260 Z" fill="#4A6B3A" opacity="0.5"/>
  <path d="M30 260 L45 225 L60 260 Z" fill="#5A7A48" opacity="0.4"/>
  <path d="M335 260 L350 215 L365 260 Z" fill="#4A6B3A" opacity="0.5"/>
  <path d="M355 260 L370 230 L385 260 Z" fill="#5A7A48" opacity="0.4"/>

  <!-- Stars -->
  <circle cx="120" cy="100" r="1.5" fill="#8B7355" opacity="0.6"/>
  <circle cx="280" cy="80" r="1.5" fill="#8B7355" opacity="0.6"/>
  <circle cx="330" cy="120" r="1" fill="#8B7355" opacity="0.4"/>
  <circle cx="70" cy="130" r="1" fill="#8B7355" opacity="0.4"/>
  <circle cx="150" cy="85" r="1.2" fill="#8B7355" opacity="0.5"/>
  <circle cx="250" cy="95" r="1.2" fill="#8B7355" opacity="0.5"/>
</svg>
